name: 🛰️ Antigravity — Deploy to Satellite Fleet

on:
  push:
    branches: [main]
    paths:
      - 'Ma_Golide_Satellites/docs/**'
      - '.github/workflows/antigravity.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual changes)'
        type: boolean
        default: false
      bootstrap_only:
        description: 'Only bootstrap API and fire safeLaunch'
        type: boolean
        default: false
      fleet_only:
        description: 'Only sync .gs code (no bootstrap)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy Satellite Code
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    
    steps:
      - name: 🚀 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install gspread google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client python-dotenv supabase
      
      - name: 🔑 Setup Google Credentials
        run: |
          mkdir -p creds
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > creds/service_account.json
            echo "✅ Service account credentials configured"
          else
            echo "⚠️ No GOOGLE_SERVICE_ACCOUNT_JSON secret found"
          fi
      
      - name: 🧪 Dry Run Check
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 Running in DRY RUN mode..."
          python antigravity_deploy.py --dry-run
      
      - name: 🛰️ Deploy to Fleet (GS Code Only)
        if: github.event.inputs.fleet_only == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "📡 Deploying .gs code to all satellites..."
          python antigravity_deploy.py --fleet-only
      
      - name: 🚀 Bootstrap & Fire
        if: github.event.inputs.bootstrap_only == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "🚀 Bootstrapping API and firing safeLaunch..."
          python antigravity_deploy.py --bootstrap --parallel
      
      - name: 🌌 Full Antigravity Deploy
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.fleet_only != 'true' && github.event.inputs.bootstrap_only != 'true'
        run: |
          echo "🌌 Running full antigravity deployment..."
          python antigravity_deploy.py --parallel
      
      - name: 📊 Upload Deployment Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: antigravity_summary.json
          retention-days: 30
      
      - name: 📝 Post Deploy Summary
        if: always()
        run: |
          echo "## 🛰️ Antigravity Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f antigravity_summary.json ]; then
            cat antigravity_summary.json | python -m json.tool >> $GITHUB_STEP_SUMMARY
          else
            echo "No summary file generated" >> $GITHUB_STEP_SUMMARY
          fi
